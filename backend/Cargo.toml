[workspace]
members = ["entity"]
resolver = "2"

[package]
name = "lingxi-backend"
version = "0.1.0"
edition = "2021"

[dependencies]
entity = { path = "entity" }

rocket = { version = "0.5", features = ["json"] }
rocket_ws = "0.1"
rocket_cors = "0.6"

sea-orm = { version = "2.0", default-features = false, features = [
    "sqlx-postgres",
    "runtime-tokio-rustls",
    "macros",
    "with-json",
    "with-chrono",
    "with-rust_decimal",
    "with-uuid",
    "with-time",
    "stream",
] }

tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.8"
anyhow = "1"
thiserror = "1"
